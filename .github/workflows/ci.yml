name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "5.1"
      - uses: leafo/gh-actions-luarocks@v5
      - run: luarocks install luacheck
      - run: luacheck core rules $(ls -d adapters bench 2>/dev/null)

  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "5.1"
      - uses: leafo/gh-actions-luarocks@v5
      - run: luarocks install busted && luarocks install dkjson && luarocks install lrexlib-pcre2
      - run: make golden-check
      - run: |
          busted

  openresty-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: openresty/openresty:alpine-fat
      options: --init
    steps:
      - uses: actions/checkout@v4
      - run: |
          apk add --no-cache perl perl-app-cpanminus perl-dev make gcc musl-dev
          cpanm --notest --quiet Test::Nginx
          opm get ledgetech/lua-resty-http
          cd adapters/openresty && prove -r t/

  js:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: adapters/js
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: adapters/js/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  grpc-shim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: adapters/envoy/grpc-shim/go.mod
      - run: cd adapters/envoy/grpc-shim && go vet ./... && go build ./...
      - run: cd adapters/haproxy/spoa && go vet ./... && go build ./...

  litellm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx pytest
      - run: cd adapters/litellm && python3 -m pytest -q

  haproxy-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -q -t jev-edge-test -f adapters/openresty/Dockerfile.test adapters/openresty
      - run: sh adapters/haproxy/e2e/run.sh

  apisix-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -q -t jev-edge-test -f adapters/openresty/Dockerfile.test adapters/openresty
      - run: sh adapters/apisix/e2e/run.sh

  envoy-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -q -t jev-edge-test -f adapters/openresty/Dockerfile.test adapters/openresty
      - run: sh adapters/envoy/e2e/run.sh

  forward-auth-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -q -t jev-edge-test -f adapters/openresty/Dockerfile.test adapters/openresty
      - run: sh adapters/forward-auth/e2e/run.sh
