name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "5.1"
      - uses: leafo/gh-actions-luarocks@v5
      - run: luarocks install luacheck
      - run: luacheck core rules $(ls -d adapters bench 2>/dev/null)

  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "5.1"
      - uses: leafo/gh-actions-luarocks@v5
      - run: luarocks install busted && luarocks install dkjson && luarocks install lrexlib-pcre2
      - run: |
          busted

  openresty-tests:
    runs-on: ubuntu-latest
    container:
      image: openresty/openresty:alpine-fat
      options: --init
    steps:
      - uses: actions/checkout@v4
      - run: |
          apk add --no-cache perl perl-app-cpanminus perl-dev make gcc musl-dev
          cpanm --notest --quiet Test::Nginx
          opm get ledgetech/lua-resty-http
          cd adapters/openresty && prove -r t/

  grpc-shim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: adapters/envoy/grpc-shim/go.mod
      - run: cd adapters/envoy/grpc-shim && go vet ./... && go build ./...

  envoy-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -q -t jev-edge-test -f adapters/openresty/Dockerfile.test adapters/openresty
      - run: sh adapters/envoy/e2e/run.sh
