name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  # every pull request runs, docs-only ones included: the main ruleset
  # requires `ci-ok`, and a check that never reports blocks the merge
  pull_request:
  workflow_dispatch:
  # Weekly: the e2e jobs pull upstream Envoy, HAProxy, APISIX, Traefik, Caddy
  # and nginx images, which move without a commit here.
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

# A newer push to the same PR makes the running one obsolete; main keeps
# every run so each merge has a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13.0.0
        with:
          luaVersion: "5.1"
      - uses: leafo/gh-actions-luarocks@35d062def313a7699a0d513e996bcf4352f05389 # v6.1.0
      - run: luarocks install luacheck
      - run: make lint
      # tripwires for bug classes a past audit found (scripts/invariants.lua)
      - run: make invariants
      - run: luarocks lint *.rockspec
      # ops/: alert rules parse and their unit tests pass (prom/prometheus v3.5.0, by digest)
      - name: promtool check + test alert rules
        run: |
          img=prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
          docker run --rm -v "$PWD/ops":/ops --entrypoint promtool $img check rules /ops/prometheus/jev-edge-rules.yml
          docker run --rm -v "$PWD/ops":/ops --entrypoint promtool $img test rules /ops/prometheus/jev-edge-rules.test.yml
      - name: grafana dashboard is valid JSON
        run: python3 -m json.tool ops/grafana/jev-edge.json > /dev/null

  # Core runs on LuaJIT in production (OpenResty) and is tested on PUC Lua as
  # well: 5.5 made for-loop variables const, which LuaJIT never complains about.
  core-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        lua: ["5.1", "5.4", "5.5", "luajit-openresty"]
    steps:
      - uses: actions/checkout@v7
      - uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13.0.0
        with:
          luaVersion: ${{ matrix.lua }}
      - uses: leafo/gh-actions-luarocks@35d062def313a7699a0d513e996bcf4352f05389 # v6.1.0
      - run: luarocks install busted && luarocks install dkjson && luarocks install lrexlib-pcre2
      - run: make golden-check
      - run: make conformance-check
      - run: busted
      - if: matrix.lua == 'luajit-openresty'
        run: make luajit-check LUAJIT=lua

  # One image for the Test::Nginx suite and every e2e job, the same one
  # `make test-openresty` builds; layers come from the Actions cache.
  openresty-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: adapters/openresty
          file: adapters/openresty/Dockerfile.test
          tags: jev-edge-test
          load: true
          cache-from: type=gha,scope=jev-edge-test
          cache-to: type=gha,scope=jev-edge-test,mode=max
      - run: docker run --rm --init -v "$PWD":/work jev-edge-test

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        gateway: [envoy, haproxy, apisix, kong, forward-auth]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: adapters/openresty
          file: adapters/openresty/Dockerfile.test
          tags: jev-edge-test
          load: true
          cache-from: type=gha,scope=jev-edge-test
      - run: sh adapters/${{ matrix.gateway }}/e2e/run.sh

  js:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: adapters/js
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: adapters/js/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # the published build config, not only the typecheck one
      - run: pnpm build

  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        module: [adapters/envoy/grpc-shim, adapters/haproxy/spoa]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # latest 1.26 patch: standard-library security fixes land there
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...

  litellm:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: adapters/litellm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install httpx pytest ruff
      # pyflakes and bugbear: real bugs, not style
      - run: ruff check --select F,B,E --ignore E501 --target-version py39 .
      - run: python3 -m pytest -q

  # laya-server unit tests and the protocol conformance suite against its
  # mock backend, plus the image the README tells people to build.
  laya-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check --select F,B,E --ignore E501 --target-version py39 adapters/laya-server conformance
      - run: make test-laya
      - run: docker build -q -t laya-server adapters/laya-server
      - name: conformance against the image
        run: |
          docker run -d --rm --name laya -p 8080:8080 -e LAYA_BACKEND=mock -e LAYA_ACCESS_LOG=0 laya-server
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8080/healthz >/dev/null && break; sleep 1; done
          make conformance ENDPOINT=http://127.0.0.1:8080/v1/systemone STRICT=1 MOCK=1
          docker stop laya

  # The one check the main ruleset requires: green only when every job above
  # succeeded. Adding, removing or renaming a job or matrix entry needs no
  # ruleset change, only an edit to `needs` here (scripts/invariants.lua
  # checks that it lists every job).
  ci-ok:
    if: always()
    needs: [lint, core-tests, openresty-tests, e2e, js, go, litellm, laya-server]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
