name: security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # advisories are published without a commit here
  schedule:
    - cron: "41 5 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Static analysis of the TypeScript, Go and Python adapters and of the
  # workflows themselves. (Lua has no CodeQL support; scripts/invariants.lua
  # and luacheck cover it in ci.yml.)
  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
          - language: go
            build-mode: manual
    steps:
      - uses: actions/checkout@v7
      - if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: false
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - if: matrix.language == 'go'
        run: |
          (cd adapters/envoy/grpc-shim && go build ./...)
          (cd adapters/haproxy/spoa && go build ./...)
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  # Known vulnerabilities in code paths the Go binaries actually call. Fails
  # when a fix has been released; advisories fixed only in a pre-release are
  # reported in the log but do not block (nothing to upgrade to yet).
  govulncheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        module: [adapters/envoy/grpc-shim, adapters/haproxy/spoa]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./... || true
      - name: fail on reachable vulnerabilities with a released fix
        run: |
          govulncheck -format json ./... > vuln.json || true
          jq -r 'select(.finding) | .finding
                 | select(.trace[0].function != null)
                 | select((.fixed_version // "") != "" and (.fixed_version | test("-") | not))
                 | "\(.osv) fixed in \(.fixed_version)"' vuln.json | sort -u > fixable.txt
          if [ -s fixable.txt ]; then echo "upgrade needed:"; cat fixable.txt; exit 1; fi

  js-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: adapters/js
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm audit --audit-level high
