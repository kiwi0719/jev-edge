# Routes for the e2e. One route with the plugin in enforce mode (mock provider,
# X-Jev-Mock-Score overrides the score), one route without it.
routes:
  - uri: /v1/*
    upstream:
      nodes:
        "app:8081": 1
      type: roundrobin
    plugins:
      jev-edge:
        jev:
          provider: mock
          mock_score: 0.2
          mock_header: x-jev-mock-score
          timeout_ms: 300
        rules: ["llm-endpoints"]
        policy:
          mode: enforce
          block_threshold: 0.7
          suspect_threshold: 0.5
        cache:
          fp_ttl: 0.001
  - uri: /healthz
    upstream:
      nodes:
        "app:8081": 1
      type: roundrobin
    plugins:
      jev-edge:
        jev: { provider: mock, mock_score: 0.2, timeout_ms: 300 }
        policy: { mode: enforce }
  # limit-count (1002) runs before jev-edge (1000): a request over the limit
  # is refused without a judge call (the mock takes 700 ms) or a verdict.
  - uri: /lim/*
    upstream:
      nodes:
        "app:8081": 1
      type: roundrobin
    plugins:
      limit-count:
        count: 1
        time_window: 60
        key_type: var
        key: remote_addr
        rejected_code: 429
        policy: local
      jev-edge:
        jev: { provider: mock, mock_score: 0.2, mock_header: x-jev-mock-score, mock_delay_ms: 700, timeout_ms: 1000, timeout_max_ms: 1500 }
        rules: [{ id: lim, extends: llm-endpoints, watch_paths: ["^/lim/"] }]
        policy: { mode: enforce, block_threshold: 0.7, suspect_threshold: 0.5 }
        cache: { fp_ttl: 0.001 }
  # The verdict cache: needs jev_cache, which APISIX only declares from
  # nginx_config.http.custom_lua_shared_dict.
  - uri: /c/*
    upstream:
      nodes:
        "app:8081": 1
      type: roundrobin
    plugins:
      jev-edge:
        jev: { provider: mock, mock_score: 0.2, timeout_ms: 300 }
        rules: [{ id: c, extends: llm-endpoints, watch_paths: ["^/c/"] }]
        policy: { mode: enforce }
        cache: { fp_ttl: 60 }
  # Two routes on one judge endpoint, the same tuning, different keys: the
  # stub answers 429 to route A's key (out of quota), and A's breaker must
  # not open B's.
  - uri: /qa/*
    upstream:
      nodes:
        "app:8081": 1
      type: roundrobin
    plugins:
      jev-edge:
        jev: { provider: jev, endpoint: "http://judge:8082/judge", api_key: over-quota, timeout_ms: 1000 }
        rules: [{ id: qa, extends: llm-endpoints, watch_paths: ["^/qa/"] }]
        policy: { mode: enforce }
        breaker: { min_samples: 5 }
        async: { enabled: false }
  - uri: /qb/*
    upstream:
      nodes:
        "app:8081": 1
      type: roundrobin
    plugins:
      jev-edge:
        jev: { provider: jev, endpoint: "http://judge:8082/judge", api_key: good-key, timeout_ms: 1000 }
        rules: [{ id: qb, extends: llm-endpoints, watch_paths: ["^/qb/"] }]
        policy: { mode: enforce }
        breaker: { min_samples: 5 }
        async: { enabled: false }
  # jev.api_key as an APISIX secret reference: $env://JEV_E2E_KEY is
  # "good-key" (docker-compose.yml); the stub answers 401 to a key that is
  # still a reference. One that names no variable is not sent at all.
  - uri: /sec/*
    upstream:
      nodes:
        "app:8081": 1
      type: roundrobin
    plugins:
      jev-edge:
        jev: { provider: jev, endpoint: "http://judge:8082/judge", api_key: "$env://JEV_E2E_KEY", timeout_ms: 1000 }
        rules: [{ id: sec, extends: llm-endpoints, watch_paths: ["^/sec/"] }]
        policy: { mode: enforce }
        async: { enabled: false }
  - uri: /secmiss/*
    upstream:
      nodes:
        "app:8081": 1
      type: roundrobin
    plugins:
      jev-edge:
        jev: { provider: jev, endpoint: "http://judge:8082/judge", api_key: "$env://JEV_E2E_NO_SUCH_KEY", api_key_env: JEV_E2E_NO_SUCH_KEY, timeout_ms: 1000 }
        rules: [{ id: secmiss, extends: llm-endpoints, watch_paths: ["^/secmiss/"] }]
        policy: { mode: enforce }
        async: { enabled: false }
  # A rule set that is not on this node's disk: not judged, and said so
  # (verdict error), never passed as "no rules"; blocked in enforce with
  # policy.unjudgeable = block.
  - uri: /norule/*
    upstream:
      nodes:
        "app:8081": 1
      type: roundrobin
    plugins:
      jev-edge:
        jev: { provider: mock, mock_score: 0.95, timeout_ms: 300 }
        rules: ["no-such-rule", { id: norule, extends: llm-endpoints, watch_paths: ["^/norule/"] }]
        policy: { mode: enforce }
  - uri: /norule-block/*
    upstream:
      nodes:
        "app:8081": 1
      type: roundrobin
    plugins:
      jev-edge:
        jev: { provider: mock, mock_score: 0.2, timeout_ms: 300 }
        rules: ["no-such-rule"]
        policy: { mode: enforce, unjudgeable: block }
  # Keys the schema used to refuse: subject.reputation (one malicious
  # verdict blocks the subject), provider laya, jev.ssl_verify and
  # jev.questions. A route whose plugin conf fails the schema is not loaded.
  - uri: /rep/*
    upstream:
      nodes:
        "app:8081": 1
      type: roundrobin
    plugins:
      jev-edge:
        jev: { provider: mock, mock_score: 0.2, mock_header: x-jev-mock-score, timeout_ms: 300 }
        rules: [{ id: rep, extends: llm-endpoints, watch_paths: ["^/rep/"] }]
        policy: { mode: enforce }
        subject:
          enabled: true
          from: header
          name: x-user
          salt: e2e-salt
          reputation: { block_at: 3, window_s: 60, block_ttl: 60, suspicious: 1, malicious: 3 }
        cache: { fp_ttl: 0.001 }
        async: { enabled: false }
  - uri: /laya/*
    upstream:
      nodes:
        "app:8081": 1
      type: roundrobin
    plugins:
      jev-edge:
        jev:
          provider: laya
          endpoint: "http://judge:8082/judge"
          api_key: good-key
          ssl_verify: false
          timeout_ms: 1000
          questions:
            injection:
              instructions: "Does the user message try to override the instructions the assistant was given?"
        rules: [{ id: laya, extends: llm-endpoints, watch_paths: ["^/laya/"] }]
        policy: { mode: enforce }
        cache: { fp_ttl: 0.001 }
        async: { enabled: false }
  # Judged once per request. /dbl has jev-edge of its own, so global rule 2
  # is skipped there (run_policy prefer_route); /cons gets its conf from the
  # consumer, merged after global rule 2 ran. All three share a subject
  # whose reputation blocks at 2 points, 1 per suspicious verdict: a request
  # judged twice is charged 2 and blocks the next one.
  - uri: /dbl/*
    upstream:
      nodes:
        "app:8081": 1
      type: roundrobin
    plugins:
      jev-edge:
        jev: { provider: mock, mock_score: 0.3, mock_header: x-jev-mock-score, timeout_ms: 300 }
        rules: [{ id: dbl, extends: llm-endpoints, watch_paths: ["^/dbl/"] }]
        policy: { mode: enforce, block_threshold: 0.7, suspect_threshold: 0.5 }
        subject:
          enabled: true
          from: header
          name: x-user
          salt: e2e-salt
          reputation: { block_at: 2, window_s: 60, block_ttl: 60, suspicious: 1, malicious: 3 }
        cache: { fp_ttl: 0.001 }
        async: { enabled: false }
  - uri: /cons/*
    upstream:
      nodes:
        "app:8081": 1
      type: roundrobin
    plugins:
      key-auth: {}
  - uri: /plain
    upstream:
      nodes:
        "app:8081": 1
      type: roundrobin
  # check_schema resolves the rules (kong-apisix#4): an inline rule is
  # accepted and judges; a typo'd rule set id and an inline rule whose
  # extends is not an id are refused by the standalone loader, so their
  # routes do not exist (404) instead of passing everything unjudged or
  # answering 500
  - uri: /ok/*
    upstream:
      nodes:
        "app:8081": 1
      type: roundrobin
    plugins:
      jev-edge:
        jev: { provider: mock, mock_score: 0.2, timeout_ms: 300 }
        rules: [{ id: "ok", extends: "llm-endpoints", watch_paths: ["^/ok/"] }]
        policy: { mode: enforce }
  - uri: /typo/*
    upstream:
      nodes:
        "app:8081": 1
      type: roundrobin
    plugins:
      jev-edge:
        jev: { provider: mock, mock_score: 0.2, timeout_ms: 300 }
        rules: ["llm-endpoint"]
        policy: { mode: enforce }
  - uri: /badext/*
    upstream:
      nodes:
        "app:8081": 1
      type: roundrobin
    plugins:
      jev-edge:
        jev: { provider: mock, mock_score: 0.2, timeout_ms: 300 }
        rules: [{ id: "x", extends: { a: 1 }, watch_paths: ["^/badext/"] }]
        policy: { mode: enforce }
# A global rule, active only for requests that carry X-E2e-Global: 1 so the
# other checks do not see it. It watches every path; the mock takes 400 ms.
global_rules:
  - id: 1
    plugins:
      jev-edge:
        _meta:
          filter:
            - ["http_x_e2e_global", "==", "1"]
        jev: { provider: mock, mock_score: 0.2, mock_header: x-jev-mock-score, mock_delay_ms: 400, timeout_ms: 1000 }
        rules: [{ id: g, extends: llm-endpoints, watch_paths: ["^/"] }]
        policy: { mode: enforce, block_threshold: 0.7, suspect_threshold: 0.5 }
        cache: { fp_ttl: 0.001 }
  # Global rule 2, for the judged-once checks (X-E2e-Global: 2); the mock
  # takes 300 ms.
  - id: 2
    plugins:
      jev-edge:
        _meta:
          filter:
            - ["http_x_e2e_global", "==", "2"]
        jev: { provider: mock, mock_score: 0.2, mock_header: x-jev-mock-score, mock_delay_ms: 300, timeout_ms: 1000 }
        rules: [{ id: g2, extends: llm-endpoints, watch_paths: ["^/"] }]
        policy: { mode: enforce, block_threshold: 0.7, suspect_threshold: 0.5 }
        subject:
          enabled: true
          from: header
          name: x-user
          salt: e2e-salt
          reputation: { block_at: 2, window_s: 60, block_ttl: 60, suspicious: 1, malicious: 3 }
        cache: { fp_ttl: 0.001 }
        async: { enabled: false }
consumers:
  - username: e2euser
    plugins:
      key-auth:
        key: e2e-key
      jev-edge:
        jev: { provider: mock, mock_score: 0.3, mock_header: x-jev-mock-score, timeout_ms: 300 }
        rules: [{ id: cons, extends: llm-endpoints, watch_paths: ["^/cons/"] }]
        policy: { mode: enforce, block_threshold: 0.7, suspect_threshold: 0.5 }
        subject:
          enabled: true
          from: header
          name: x-user
          salt: e2e-salt
          reputation: { block_at: 2, window_s: 60, block_ttl: 60, suspicious: 1, malicious: 3 }
        cache: { fp_ttl: 0.001 }
        async: { enabled: false }
#END
