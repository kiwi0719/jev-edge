# Routes for the e2e. One route with the plugin in enforce mode (mock provider,
# X-Jev-Mock-Score overrides the score), one route without it.
routes:
  - uri: /v1/*
    upstream:
      nodes:
        "app:8081": 1
      type: roundrobin
    plugins:
      jev-edge:
        jev:
          provider: mock
          mock_score: 0.2
          mock_header: x-jev-mock-score
          timeout_ms: 300
        rules: ["llm-endpoints"]
        policy:
          mode: enforce
          block_threshold: 0.7
          suspect_threshold: 0.5
        cache:
          fp_ttl: 0.001
  - uri: /healthz
    upstream:
      nodes:
        "app:8081": 1
      type: roundrobin
    plugins:
      jev-edge:
        jev: { provider: mock, mock_score: 0.2, timeout_ms: 300 }
        policy: { mode: enforce }
  # The verdict cache: needs jev_cache, which APISIX only declares from
  # nginx_config.http.custom_lua_shared_dict.
  - uri: /c/*
    upstream:
      nodes:
        "app:8081": 1
      type: roundrobin
    plugins:
      jev-edge:
        jev: { provider: mock, mock_score: 0.2, timeout_ms: 300 }
        rules: [{ id: c, extends: llm-endpoints, watch_paths: ["^/c/"] }]
        policy: { mode: enforce }
        cache: { fp_ttl: 60 }
  # Two routes on one judge endpoint, the same tuning, different keys: the
  # stub answers 429 to route A's key (out of quota), and A's breaker must
  # not open B's.
  - uri: /qa/*
    upstream:
      nodes:
        "app:8081": 1
      type: roundrobin
    plugins:
      jev-edge:
        jev: { provider: jev, endpoint: "http://judge:8082/judge", api_key: over-quota, timeout_ms: 1000 }
        rules: [{ id: qa, extends: llm-endpoints, watch_paths: ["^/qa/"] }]
        policy: { mode: enforce }
        breaker: { min_samples: 5 }
        async: { enabled: false }
  - uri: /qb/*
    upstream:
      nodes:
        "app:8081": 1
      type: roundrobin
    plugins:
      jev-edge:
        jev: { provider: jev, endpoint: "http://judge:8082/judge", api_key: good-key, timeout_ms: 1000 }
        rules: [{ id: qb, extends: llm-endpoints, watch_paths: ["^/qb/"] }]
        policy: { mode: enforce }
        breaker: { min_samples: 5 }
        async: { enabled: false }
  - uri: /plain
    upstream:
      nodes:
        "app:8081": 1
      type: roundrobin
#END
