# Routes for the e2e. One route with the plugin in enforce mode (mock provider,
# X-Jev-Mock-Score overrides the score), one route without it.
routes:
  - uri: /v1/*
    upstream:
      nodes:
        "app:8081": 1
      type: roundrobin
    plugins:
      jev-edge:
        jev:
          provider: mock
          mock_score: 0.2
          mock_header: x-jev-mock-score
          timeout_ms: 300
        rules: ["llm-endpoints"]
        policy:
          mode: enforce
          block_threshold: 0.7
          suspect_threshold: 0.5
        cache:
          fp_ttl: 0.001
  - uri: /healthz
    upstream:
      nodes:
        "app:8081": 1
      type: roundrobin
    plugins:
      jev-edge:
        jev: { provider: mock, mock_score: 0.2, timeout_ms: 300 }
        policy: { mode: enforce }
  - uri: /plain
    upstream:
      nodes:
        "app:8081": 1
      type: roundrobin
  # check_schema resolves the rules (kong-apisix#4): an inline rule is
  # accepted and judges; a typo'd rule set id and an inline rule whose
  # extends is not an id are refused by the standalone loader, so their
  # routes do not exist (404) instead of passing everything unjudged or
  # answering 500
  - uri: /ok/*
    upstream:
      nodes:
        "app:8081": 1
      type: roundrobin
    plugins:
      jev-edge:
        jev: { provider: mock, mock_score: 0.2, timeout_ms: 300 }
        rules: [{ id: "ok", extends: "llm-endpoints", watch_paths: ["^/ok/"] }]
        policy: { mode: enforce }
  - uri: /typo/*
    upstream:
      nodes:
        "app:8081": 1
      type: roundrobin
    plugins:
      jev-edge:
        jev: { provider: mock, mock_score: 0.2, timeout_ms: 300 }
        rules: ["llm-endpoint"]
        policy: { mode: enforce }
  - uri: /badext/*
    upstream:
      nodes:
        "app:8081": 1
      type: roundrobin
    plugins:
      jev-edge:
        jev: { provider: mock, mock_score: 0.2, timeout_ms: 300 }
        rules: [{ id: "x", extends: { a: 1 }, watch_paths: ["^/badext/"] }]
        policy: { mode: enforce }
#END
