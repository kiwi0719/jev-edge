# Stub upstream: echoes the verdict headers Envoy attached.
worker_processes 1;
error_log /tmp/app/logs/error.log warn;
pid /tmp/app/nginx.pid;
events {}
http {
    server {
        listen 8081;
        location / {
            content_by_lua_block {
                local h = ngx.req.get_headers()
                ngx.say("app verdict=", h["x-jev-verdict"] or "-", " score=", h["x-jev-score"] or "-",
                        " source=", h["x-jev-source"] or "-")
            }
        }
    }
}
