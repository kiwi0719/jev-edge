# Stub upstream: echoes the verdict headers Envoy attached.
worker_processes 1;
error_log /tmp/app/logs/error.log warn;
pid /tmp/app/nginx.pid;
events {}
http {
    server {
        listen 8081;
        client_max_body_size 0;   # forward-auth e2e sends a 1.5 MB body
        large_client_header_buffers 4 64k;   # the size-cap checks send 16 KB of headers
        location / {
            content_by_lua_block {
                local h = ngx.req.get_headers()
                -- X-E2e-Jev-Names: 1 adds the name of every X-Jev-* header
                -- that arrived, for the checks that nothing else got through
                local names = ""
                if h["x-e2e-jev-names"] then
                    local n = {}
                    for k in pairs(ngx.req.get_headers(0)) do
                        if k:sub(1, 6) == "x-jev-" then n[#n + 1] = k end
                    end
                    table.sort(n)
                    names = " jev=" .. table.concat(n, ",")
                end
                -- X-E2e-Reason: 1 adds the reason, for the checks that need it
                ngx.say("app verdict=", h["x-jev-verdict"] or "-", " score=", h["x-jev-score"] or "-",
                        " source=", h["x-jev-source"] or "-",
                        h["x-e2e-reason"] and (" reason=" .. (h["x-jev-reason"] or "-")) or "", names)
            }
        }
    }
}
