worker_processes 1;
error_log /tmp/nx/logs/error.log notice;
pid /tmp/nx/nginx.pid;
events {}
http {
    lua_package_path "/work/adapters/openresty/lib/?.lua;/work/?.lua;;";
    lua_shared_dict jev_cache 8m;
    lua_shared_dict jev_config 1m;
    lua_shared_dict jev_metrics 1m;
    lua_shared_dict jev_subject 1m;
    init_by_lua_block        { require("resty.jev.edge").init("/tmp/nx/conf/jev-edge.conf.lua") }
    init_worker_by_lua_block { require("resty.jev.edge").init_worker() }
    # e2e: one line per authz call on stdout, so run.sh can check what the
    # gateway handed over (the partial-body flag and how many bytes)
    log_format authz 'authz $uri envoy_partial=$http_x_envoy_auth_partial_body jev_partial=$http_x_jev_body_partial bytes=$request_length reason="$sent_http_x_jev_reason"';
    access_log /dev/stdout authz;
    server {
        listen 8080;
        # The authz hop's size contract (adapters/envoy/README.md): every
        # request the gateway in front accepts must fit here, or nginx
        # answers 400 / 414 / 413 before jev-edge runs. Envoy caps the header
        # block, path included, at max_request_headers_kb (60), HAProxy at
        # 16 KiB of headers and an 8 KiB URI: any of them fits one 64k buffer.
        # Bodies: Envoy's max_request_bytes and HAProxy's 96 KiB stay within
        # client_max_body_size.
        large_client_header_buffers 4 64k;
        client_max_body_size 1m;
        location /_jev/authz/ {
            # e2e only: X-E2e-Refuse makes nginx answer 400 before jev-edge
            # runs, as it would for a request past its buffers; the gRPC shim
            # and the SPOE agent must report that request unjudgeable
            if ($http_x_e2e_refuse) { return 400; }
            content_by_lua_block { require("resty.jev.edge").authz() }
        }
        location = /_jev/metrics { content_by_lua_block { require("resty.jev.edge").metrics() } }
    }
}
