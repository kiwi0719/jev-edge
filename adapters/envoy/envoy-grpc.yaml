# Envoy with jev-edge as a gRPC ext_authz service via the shim.
# Envoy -> (ext_authz, gRPC) -> grpc-shim -> OpenResty /_jev/authz -> verdict -> upstream
static_resources:
  listeners:
    - name: ingress
      address: { socket_address: { address: 0.0.0.0, port_value: 10000 } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress
                use_remote_address: true
                # collapse "/a/../b", "%2e%2e" and "//" before the path reaches
                # ext_authz, so it cannot be steered at the adapter's admin endpoints
                normalize_path: true
                merge_slashes: true
                route_config:
                  name: local
                  virtual_hosts:
                    - name: app
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: app }
                http_filters:
                  # never trust a client-supplied verdict: a route-level
                  # request_headers_to_remove runs at the router, after ext_authz has
                  # set the real verdict; this filter runs before ext_authz instead
                  - name: envoy.filters.http.header_mutation
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutation
                      mutations:
                        request_mutations:
                          - remove: x-jev-verdict
                          - remove: x-jev-score
                          - remove: x-jev-reason
                          - remove: x-jev-source
                          - remove: x-jev-request-id
                          - remove: x-jev-subject
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      transport_api_version: V3
                      failure_mode_allow: true
                      failure_mode_allow_header_add: true
                      with_request_body:
                        max_request_bytes: 65536
                        allow_partial_message: true
                        pack_as_bytes: true            # raw_body instead of a UTF-8 string
                      grpc_service:
                        envoy_grpc: { cluster_name: jev-shim }
                        timeout: 2s
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: jev-shim
      connect_timeout: 0.25s
      type: STRICT_DNS
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config: { http2_protocol_options: {} }
      load_assignment:
        cluster_name: jev-shim
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: jev-shim, port_value: 9001 } } }
    - name: app
      connect_timeout: 0.25s
      type: STRICT_DNS
      load_assignment:
        cluster_name: app
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: app, port_value: 8081 } } }
