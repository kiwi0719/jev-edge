# Envoy with jev-edge as an HTTP ext_authz service.
# Envoy -> (ext_authz, HTTP) -> OpenResty /_jev/authz -> verdict -> upstream
static_resources:
  listeners:
    - name: ingress
      address: { socket_address: { address: 0.0.0.0, port_value: 10000 } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress
                use_remote_address: true
                # collapse "/a/../b", "%2e%2e" and "//" before the path reaches
                # ext_authz, so it cannot be steered at the adapter's admin endpoints
                normalize_path: true
                merge_slashes: true
                # and refuse (400) an encoded slash or backslash: Envoy leaves
                # %2F escaped by default, so "..%2F" is no dot segment to it,
                # while nginx decodes it and resolves the ".." after
                # path_prefix: /_jev/authz/v1/..%2F..%2F..%2F_jev/config is
                # /_jev/config there. UNESCAPE_AND_REDIRECT is the choice for
                # an API that needs %2F in its paths.
                path_with_escaped_slashes_action: REJECT_REQUEST
                # size contract of the authz hop: the whole header block, path
                # included, is capped here (431 past it), and the nginx serving
                # /_jev/authz must take any request under the cap (README:
                # large_client_header_buffers 4 64k). Raise both together.
                max_request_headers_kb: 60
                route_config:
                  name: local
                  virtual_hosts:
                    - name: app
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: app }
                http_filters:
                  # never trust a client-supplied verdict, subject or cut flag: a
                  # route-level request_headers_to_remove runs at the router, after
                  # ext_authz has set the real verdict; this filter runs before
                  # ext_authz instead. x-jev-body-partial is the HAProxy agent's
                  # cut flag: allowed_headers keeps a client's copy from
                  # /_jev/authz, and this keeps it from the upstream and from a
                  # config that forwards more headers to ext_authz.
                  - name: envoy.filters.http.header_mutation
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutation
                      mutations:
                        request_mutations:
                          - remove: x-jev-verdict
                          - remove: x-jev-score
                          - remove: x-jev-reason
                          - remove: x-jev-source
                          - remove: x-jev-request-id
                          - remove: x-jev-subject
                          - remove: x-jev-body-partial
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      transport_api_version: V3
                      # fail-open at the Envoy layer too: an unreachable authz service allows the request
                      failure_mode_allow: true
                      failure_mode_allow_header_add: true
                      # headers forwarded to the authz service (ExtAuthz.allowed_headers; the
                      # older authorization_request.allowed_headers is deprecated)
                      allowed_headers:
                        patterns:
                          - exact: content-type
                          - exact: content-encoding
                          - exact: content-length
                          - exact: x-forwarded-for
                          - exact: x-envoy-external-address
                          - exact: x-request-id
                          - exact: x-jev-mock-score     # e2e only; drop in production
                      with_request_body:
                        max_request_bytes: 1048576     # matches rules.max_body_bytes (1 MiB)
                        allow_partial_message: true    # larger bodies arrive cut, with x-envoy-auth-partial-body: true; jev-edge scans them as a head
                      http_service:
                        server_uri:
                          uri: http://jev-edge:8080
                          cluster: jev-edge
                          timeout: 2s                  # must exceed jev.timeout_max_ms
                        path_prefix: /_jev/authz
                        authorization_response:
                          allowed_upstream_headers:
                            patterns:
                              - prefix: x-jev-
                          allowed_client_headers:
                            patterns:
                              - exact: content-type
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: jev-edge
      connect_timeout: 0.25s
      type: STRICT_DNS
      load_assignment:
        cluster_name: jev-edge
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: jev-edge, port_value: 8080 } } }
    - name: app
      connect_timeout: 0.25s
      type: STRICT_DNS
      load_assignment:
        cluster_name: app
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: app, port_value: 8081 } } }
