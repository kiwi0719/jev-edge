worker_processes 1;
error_log /tmp/nx/logs/error.log notice;
pid /tmp/nx/nginx.pid;
events {}
http {
    lua_package_path "/work/adapters/openresty/lib/?.lua;/work/?.lua;;";
    lua_shared_dict jev_cache 8m;
    lua_shared_dict jev_config 1m;
    lua_shared_dict jev_metrics 1m;
    init_by_lua_block        { require("resty.jev.edge").init("/tmp/nx/conf/jev-edge.conf.lua") }
    init_worker_by_lua_block { require("resty.jev.edge").init_worker() }
    log_format xff '$http_x_forwarded_for';
    server {
        listen 8080;
        location = /_jev/forward-auth {
            access_log /tmp/nx/logs/xff.log xff;
            content_by_lua_block { require("resty.jev.edge").forward_auth() }
        }
        location = /_e2e/last-client {
            content_by_lua_block {
                local f = io.open("/tmp/nx/logs/xff.log"); local last
                for line in f:lines() do if line ~= "" and line ~= "-" then last = line end end
                f:close()
                ngx.say((last or ""):match("^%s*([^,%s]+)") or "")
            }
        }
        # e2e helper: give an IP a bad reputation so headers-only gateways have something to enforce
        location = /_e2e/poison {
            content_by_lua_block {
                local ip = ngx.var.arg_ip
                require("resty.jev.cache").new("jev_cache"):set("rep:" .. ip, { blocked_until = ngx.now() + 60 })
                ngx.say("poisoned ", ip)
            }
        }
    }
}
