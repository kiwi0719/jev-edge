# Plain nginx (no Lua) in front of a separate jev-edge OpenResty instance.
# auth_request forwards headers only: the verdict is `skipped` unless the IP
# has a reputation entry. Run jev-edge's access() in OpenResty for full judgment.
location /v1/ {
    auth_request /_jev/forward-auth;
    auth_request_set $jev_verdict $upstream_http_x_jev_verdict;
    auth_request_set $jev_score   $upstream_http_x_jev_score;
    auth_request_set $jev_source  $upstream_http_x_jev_source;
    # proxy_set_header replaces whatever the client sent; the unset ones are
    # cleared explicitly so a forged value cannot pass through
    proxy_set_header X-Jev-Verdict    $jev_verdict;
    proxy_set_header X-Jev-Score      $jev_score;
    proxy_set_header X-Jev-Source     $jev_source;
    proxy_set_header X-Jev-Reason     "";
    proxy_set_header X-Jev-Request-Id "";
    proxy_set_header X-Jev-Subject    "";
    proxy_pass http://app;
}

location = /_jev/forward-auth {
    internal;
    proxy_pass              http://jev-edge:8080/_jev/forward-auth;
    proxy_pass_request_body off;
    proxy_set_header        Content-Length "";
    proxy_set_header        X-Original-URI    $request_uri;
    proxy_set_header        X-Original-Method $request_method;
    proxy_set_header        X-Forwarded-For   $remote_addr;
    proxy_set_header        X-Jev-Verdict     "";
    proxy_set_header        X-Jev-Subject     "";
}
