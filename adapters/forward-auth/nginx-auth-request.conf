# Plain nginx (no Lua) in front of a separate jev-edge OpenResty instance.
# auth_request forwards headers only: the verdict is `skipped` unless the IP
# has a reputation entry. Run jev-edge's access() in OpenResty for full judgment.
location /v1/ {
    auth_request /_jev/forward-auth;
    auth_request_set $jev_verdict $upstream_http_x_jev_verdict;
    auth_request_set $jev_score   $upstream_http_x_jev_score;
    auth_request_set $jev_source  $upstream_http_x_jev_source;
    # auth_request denies only on 401/403 (anything else is a 500) and drops
    # the sub-request's body; answer with JSON instead of nginx's HTML page.
    # proxy_intercept_errors is off, so the app's own 401/403 pass untouched.
    error_page 401 = @jev_denied_401;
    error_page 403 = @jev_denied_403;
    # proxy_set_header replaces whatever the client sent; the unset ones are
    # cleared explicitly so a forged value cannot pass through
    proxy_set_header X-Jev-Verdict    $jev_verdict;
    proxy_set_header X-Jev-Score      $jev_score;
    proxy_set_header X-Jev-Source     $jev_source;
    proxy_set_header X-Jev-Reason     "";
    proxy_set_header X-Jev-Request-Id "";
    proxy_set_header X-Jev-Subject    "";
    proxy_pass http://app;
}

location @jev_denied_401 {
    default_type application/json;
    return 401 '{"error":"request rejected"}';
}

location @jev_denied_403 {
    default_type application/json;
    return 403 '{"error":"request rejected"}';
}

location = /_jev/forward-auth {
    internal;
    proxy_pass              http://jev-edge:8080/_jev/forward-auth;
    proxy_pass_request_body off;
    proxy_set_header        Content-Length "";
    # the sub-request inherits every client header: set or clear each one
    # jev-edge reads, or a client could pick the path (X-Forwarded-Uri wins
    # over X-Original-URI) or the IP it is judged under
    proxy_set_header        X-Forwarded-Uri    $request_uri;
    proxy_set_header        X-Forwarded-Method $request_method;
    proxy_set_header        X-Original-URI     $request_uri;
    proxy_set_header        X-Original-Method  $request_method;
    proxy_set_header        X-Forwarded-For    $remote_addr;
    proxy_set_header        X-Envoy-External-Address "";
    proxy_set_header        X-Real-IP          "";
    proxy_set_header        X-Jev-Verdict      "";
    proxy_set_header        X-Jev-Subject      "";
}
