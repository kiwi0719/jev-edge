# Traefik v3.3+ ForwardAuth with jev-edge. Static config (traefik.yml) must
# enable the file provider; this is the dynamic part.
http:
  middlewares:
    # never trust a client-supplied verdict: strip before forwardAuth runs
    strip-jev:
      headers:
        customRequestHeaders:
          X-Jev-Verdict: ""
          X-Jev-Score: ""
          X-Jev-Source: ""
          X-Jev-Reason: ""
          X-Jev-Request-Id: ""
          X-Jev-Subject: ""
    jev-edge:
      forwardAuth:
        address: "http://jev-edge:8080/_jev/forward-auth"
        # v3.3+: send the request body so jev-edge can judge it. Without this
        # the verdict is always `skipped` (headers only).
        forwardBody: true
        # no maxBodySize: past it Traefik answers 401 itself instead of calling
        # jev-edge, so a large request would be denied rather than passed as
        # "body too large" (fail-open). Cap request size with a `buffering`
        # middleware (maxRequestBodyBytes) ahead of this one if you need to.
        # Keep false. With true, a request from an IP the entrypoint trusts
        # (forwardedHeaders.trustedIPs, e.g. your load balancer) passes the
        # client's own X-Forwarded-Uri and X-Forwarded-Method on, and
        # jev-edge judges the path the client wrote (/healthz, not watched)
        # instead of the one Traefik routes. Behind a load balancer, get the
        # client IP with the entrypoint's proxyProtocol.trustedIPs instead.
        trustForwardHeader: false
        # copy the verdict onto the request that reaches your service
        authResponseHeaders:
          - X-Jev-Verdict
          - X-Jev-Score
          - X-Jev-Source
          - X-Jev-Reason
          - X-Jev-Request-Id
        # forward only what jev-edge needs
        authRequestHeaders:
          - Content-Type
          - Content-Encoding           # without it a gzip body reads as "no text"
          - Content-Length
          - X-Forwarded-For
          - X-Jev-Mock-Score           # e2e only; drop in production
          # subject.from = "header" or "cookie": the subject never reaches
          # jev-edge unless it is listed here (jev-edge logs a warning once per
          # worker when a request through /_jev/forward-auth has none)
          # - X-Api-Key                # subject.name for from = "header"
          # - Cookie                   # from = "cookie"
  routers:
    app:
      rule: "PathPrefix(`/`)"
      entryPoints: [web]
      middlewares: [strip-jev, jev-edge]
      service: app
  services:
    app:
      loadBalancer:
        servers:
          - url: "http://app:8081"
