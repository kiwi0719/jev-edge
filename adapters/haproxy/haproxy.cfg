# Reference haproxy.cfg for jev-edge through SPOE. The agent (adapters/haproxy/spoa)
# sets txn.jev.* variables; this file turns them into a deny or X-Jev-* headers.
global
    log stdout format raw local0
    # SPOE frames carry the request, body included; the default 16 KB buffer
    # is too small. 128 KB holds the size caps below plus the 96 KiB of body
    # spoe.conf sends. Larger bodies reach the agent cut; it flags them
    # (X-Jev-Body-Partial) and jev-edge scans them as a head. Raising it (and
    # the cut in spoe.conf) to rules.max_body_bytes (1 MiB) costs that much
    # memory per connection.
    tune.bufsize 131072
    # A request nobody judged (SPOE got no answer from the agent, or the
    # agent reports that jev-edge's server refused it): `pass` forwards it
    # marked X-Jev-Verdict: skipped, `block` denies it with 403. Keep it
    # equal to the agent's -unjudged and to jev-edge's policy.unjudgeable.
    set-var proc.jev_unjudged str(pass)

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend llm
    bind *:8080
    # buffer the body so the SPOE message can carry it
    option http-buffer-request
    filter spoe engine jev-edge config /usr/local/etc/haproxy/spoe.conf

    # strip whatever the client sent
    http-request del-header X-Jev-Verdict
    http-request del-header X-Jev-Score
    http-request del-header X-Jev-Source
    http-request del-header X-Jev-Reason
    http-request del-header X-Jev-Request-Id
    http-request del-header X-Jev-Subject

    # Size contract: every request this frontend accepts fits one SPOE frame
    # and the header buffers of the nginx serving /_jev/authz (see README).
    # Larger ones are refused, whatever the agent said about them.
    http-request deny deny_status 414 if { url,length gt 8192 }
    http-request deny deny_status 431 if { req.hdrs,length gt 16384 }

    # No verdict: SPOE got no answer from the agent (txn.jev.error has its
    # error code: agent down, slower than `timeout processing`, ...). Nobody
    # judged the request: mark it unjudgeable and apply proc.jev_unjudged.
    http-request set-var(txn.jev.action) var(proc.jev_unjudged)  unless { var(txn.jev.verdict) -m found }
    http-request set-var(txn.jev.status) str(403)                unless { var(txn.jev.verdict) -m found }
    http-request set-var(txn.jev.score)  str(0.00)               unless { var(txn.jev.verdict) -m found }
    http-request set-var(txn.jev.source) str(adapter)            unless { var(txn.jev.verdict) -m found }
    http-request set-var-fmt(txn.jev.reason) "unjudgeable%%3A+spoe+error+%[var(txn.jev.error,none)]" unless { var(txn.jev.verdict) -m found }
    http-request set-var(txn.jev.verdict) str(skipped)           unless { var(txn.jev.verdict) -m found }

    # action=block: answer with jev-edge's status. `deny_status` only takes a
    # literal, so list the block_status values you use (the agent puts the
    # real one in txn.jev.status); the last line is the catch-all. Keep the
    # 400 line: the agent blocks with 400 a path nginx refuses inline (an
    # invalid %-escape such as %u0063, a %00); without it the catch-all
    # denies that with 403.
    http-request deny deny_status 400 content-type application/json string '{"error":"request rejected"}' if { var(txn.jev.action) -m str block } { var(txn.jev.status) -m str 400 }
    http-request deny deny_status 429 content-type application/json string '{"error":"request rejected"}' if { var(txn.jev.action) -m str block } { var(txn.jev.status) -m str 429 }
    http-request deny deny_status 403 content-type application/json string '{"error":"request rejected"}' if { var(txn.jev.action) -m str block }

    http-request set-header X-Jev-Verdict    %[var(txn.jev.verdict)] if { var(txn.jev.verdict) -m found }
    http-request set-header X-Jev-Score      %[var(txn.jev.score)]   if { var(txn.jev.score) -m found }
    http-request set-header X-Jev-Source     %[var(txn.jev.source)]  if { var(txn.jev.source) -m found }
    http-request set-header X-Jev-Reason     %[var(txn.jev.reason)]  if { var(txn.jev.reason) -m found }
    http-request set-header X-Jev-Request-Id %[var(txn.jev.rid)]     if { var(txn.jev.rid) -m found }

    default_backend app

backend jev-spoa
    mode tcp
    timeout connect 2s
    # SPOP connections are long-lived and idle between requests; a short
    # `timeout server` would churn them. Per-request time is bounded by
    # `timeout processing` in spoe.conf, not here.
    timeout server  5m
    server spoa jev-spoa:9000

backend app
    server app app:8081
