# SPOE engine for jev-edge. Referenced from haproxy.cfg:
#   filter spoe engine jev-edge config /usr/local/etc/haproxy/spoe.conf
[jev-edge]
spoe-agent jev-edge
    messages check-request
    option var-prefix jev
    option continue-on-error
    # txn.jev.error: set when SPOE got no answer from the agent (1 timeout,
    # 3 the message did not fit a frame, ...); haproxy.cfg then treats the
    # request as unjudgeable
    option set-on-error error
    timeout hello      2s
    timeout idle       2m
    # hard stop per request. The agent's own -timeout (default 1500ms) must be
    # smaller, so its fail-open answer (verdict=error) still arrives; if this
    # fires first the request is unjudgeable (txn.jev.error = 1).
    timeout processing 2s
    use-backend jev-spoa

# One message per HTTP request. `body` needs `option http-buffer-request` on
# the frontend; without it the agent sees an empty body and jev-edge answers
# `skipped` (no body).
#
# The message must fit one SPOE frame (tune.bufsize, 128 KiB in the reference
# haproxy.cfg). With haproxy.cfg's caps (URI 8 KiB, headers 16 KiB) and the
# body cut to 96 KiB here, every request it accepts does. Content-Type travels
# in `hdrs` like every other header, each occurrence of it, never as a second
# copy.
spoe-message check-request
    # size: the body's declared size; larger than `body` when it was cut
    args method=method path=path ip=src hdrs=req.hdrs body=req.body,bytes(0,98304) size=req.body_size
    event on-frontend-http-request
