# SPOE engine for jev-edge. Referenced from haproxy.cfg:
#   filter spoe engine jev-edge config /usr/local/etc/haproxy/spoe.conf
[jev-edge]
spoe-agent jev-edge
    messages check-request
    option var-prefix jev
    option continue-on-error
    timeout hello      2s
    timeout idle       2m
    timeout processing 2s
    use-backend jev-spoa

# One message per HTTP request. `body` needs `option http-buffer-request` on
# the frontend; without it the agent sees an empty body and jev-edge answers
# `skipped` (no body). Keep bodies under the SPOE frame size (see haproxy.cfg).
spoe-message check-request
    args method=method path=path ip=src ct=req.hdr(content-type) hdrs=req.hdrs body=req.body
    event on-frontend-http-request
