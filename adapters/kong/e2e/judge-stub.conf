# Stub System One judge for the Kong and APISIX e2e. The key "over-quota" gets
# 429 (a key out of quota, which the breaker counts); a key "vault-..." gets
# 401 unless it is the one in /secrets/jevkey now (the Kong e2e's rotated
# vault secret); a key starting with "$" (a secret reference nobody resolved)
# gets 401; any other key, or none, gets 0.97 for a text asking to ignore
# previous instructions and 0.10 otherwise.
worker_processes 1;
error_log /tmp/judge/logs/error.log warn;
pid /tmp/judge/nginx.pid;
events {}
http {
    server {
        listen 8082;
        location = /judge {
            content_by_lua_block {
                ngx.req.read_body()
                ngx.header["Content-Type"] = "application/json"
                local auth = ngx.var.http_authorization or ""
                if auth == "Bearer over-quota" then
                    ngx.status = 429
                    ngx.say('{"error":"quota exceeded"}')
                    return
                end
                if auth:find("^Bearer %$") then
                    ngx.status = 401
                    ngx.say('{"error":"invalid api key"}')
                    return
                end
                if auth:find("^Bearer vault%-") then
                    local f = io.open("/secrets/jevkey")
                    local now = f and f:read("*a"):gsub("%s+$", "")
                    if f then f:close() end
                    if auth ~= "Bearer " .. tostring(now) then
                        ngx.status = 401
                        ngx.say('{"error":"invalid api key"}')
                        return
                    end
                end
                local body = ngx.req.get_body_data() or ""
                local p = body:find("Ignore all previous instructions", 1, true) and 0.97 or 0.1
                ngx.say('{"answers":{"injection":{"noul":', p, '}}}')
            }
        }
    }
}
