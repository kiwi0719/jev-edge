# Example nginx.conf for jev-edge. Adjust lua_package_path to where you
# installed the repo (or use `make install` and drop the repo paths).

env TYPESAFE_API_KEY;

worker_processes 2;
error_log logs/error.log warn;

events { worker_connections 1024; }

http {
    # <repo>/adapters/openresty/lib for resty.jev.*, <repo> for core/ and rules/
    lua_package_path "/opt/jev-edge/adapters/openresty/lib/?.lua;/opt/jev-edge/?.lua;;";

    # Cosockets need an explicit CA bundle to verify the provider's TLS certificate.
    lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    lua_ssl_verify_depth 5;

    lua_shared_dict jev_cache   64m;
    lua_shared_dict jev_config   1m;
    lua_shared_dict jev_metrics  4m;

    init_by_lua_block        { require("resty.jev.edge").init("/etc/nginx/jev-edge.conf.lua") }
    init_worker_by_lua_block { require("resty.jev.edge").init_worker() }

    # $jev_log is already a JSON object (rid, path, ip, verdict, score, ...).
    # escape=none keeps it valid JSON; escape=json would double-escape it.
    log_format jev escape=none '$jev_log';

    upstream llm_backend { server 127.0.0.1:8000; }

    server {
        listen 8080;
        set $jev_log "";
        access_log logs/access.log jev;

        location /v1/ {
            access_by_lua_block { require("resty.jev.edge").access() }
            log_by_lua_block    { require("resty.jev.edge").log() }
            proxy_pass http://llm_backend;
        }

        location = /_jev/config {
            allow 127.0.0.1; deny all;
            content_by_lua_block { require("resty.jev.edge").config_api() }
        }

        location = /_jev/health {
            allow 127.0.0.1; deny all;
            content_by_lua_block { require("resty.jev.edge").health() }
        }

        location = /_jev/metrics {
            allow 127.0.0.1; deny all;
            content_by_lua_block { require("resty.jev.edge").metrics() }
        }

        # Sampled decisions (normalized text, fingerprint, score) when
        # sampling.enabled; GET lists, DELETE clears.
        location = /_jev/samples {
            allow 127.0.0.1; deny all;
            content_by_lua_block { require("resty.jev.edge").samples() }
        }

        # False-positive feedback: POST {"fp":...,"label":"benign","by":...}
        # with X-Jev-Token. The verdict it writes is a bypass for that exact
        # text, so keep it behind the token AND the allow list, and terminate
        # TLS in front of it.
        location = /_jev/feedback {
            allow 127.0.0.1; deny all;
            content_by_lua_block { require("resty.jev.edge").feedback() }
        }
    }
}
