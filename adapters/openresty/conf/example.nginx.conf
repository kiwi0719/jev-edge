# Example nginx.conf for jev-edge. Adjust lua_package_path to where you
# installed the repo (or use `make install` and drop the repo paths).

# Every variable jev-edge.conf.lua reads. The config file runs again in the
# workers on every reload, and workers only see the variables declared with
# `env`: an undeclared salt or token reads as empty there and the edited file
# is refused. Declaring one that is not set is harmless.
env TYPESAFE_API_KEY;
env JEV_SUBJECT_SALT;      # subject.salt
env JEV_FEEDBACK_TOKEN;    # feedback.token

worker_processes 2;
error_log logs/error.log warn;

events { worker_connections 1024; }

http {
    # <repo>/adapters/openresty/lib for resty.jev.*, <repo> for core/ and rules/
    lua_package_path "/opt/jev-edge/adapters/openresty/lib/?.lua;/opt/jev-edge/?.lua;;";

    # Cosockets need an explicit CA bundle to verify the provider's TLS certificate.
    lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    lua_ssl_verify_depth 5;

    lua_shared_dict jev_cache   64m;   # verdict cache, reputation, samples (LRU, may evict)
    lua_shared_dict jev_state    4m;   # trust grants, breaker, in-flight counters, adaptive timeout:
                                       # kept apart so a flood of new prompts cannot evict them
    lua_shared_dict jev_config   1m;
    lua_shared_dict jev_metrics  4m;
    lua_shared_dict jev_subject 16m;   # per-subject trajectories; only needed with subject.enabled.
                                       # Never evicts: when full, new trajectory entries are dropped
    lua_shared_dict jev_subject_rep 4m;  # subject reputation: points and blocks, only with
                                         # subject.reputation; apart from the trajectories any client
                                         # can fill with new subject values

    init_by_lua_block        { require("resty.jev.edge").init("/etc/nginx/jev-edge.conf.lua") }
    init_worker_by_lua_block { require("resty.jev.edge").init_worker() }

    # $jev_log is already a JSON object (rid, path, ip, verdict, score, ...).
    # escape=none keeps it valid JSON; escape=json would double-escape it.
    log_format jev escape=none '$jev_log';

    upstream llm_backend { server 127.0.0.1:8000; }

    server {
        listen 8080;
        set $jev_log "";
        access_log logs/access.log jev;

        location /v1/ {
            access_by_lua_block { require("resty.jev.edge").access() }
            log_by_lua_block    { require("resty.jev.edge").log() }
            proxy_pass http://llm_backend;
        }
    }

    # Gateway-facing endpoints, only when a gateway calls jev-edge: Envoy's
    # HTTP ext_authz (or an Istio sidecar, the gRPC shim, the HAProxy agent)
    # at /_jev/authz/, and forward-auth (Traefik, Caddy, nginx auth_request)
    # at /_jev/forward-auth. Whoever calls them picks the path, the body and
    # the client address jev-edge judges and charges (X-Forwarded-For), so
    # they answer the gateway alone: a listener of their own and an allow
    # list, never the traffic server above nor the admin listener below.
    #
    # server {
    #     listen 10.0.0.5:8081;                # an address only the gateway reaches
    #     large_client_header_buffers 4 64k;   # the authz hop's size contract (adapters/envoy/README.md)
    #     client_max_body_size 1m;
    #
    #     location /_jev/authz/ {
    #         allow 10.0.0.0/24;               # the gateway's addresses
    #         deny all;
    #         content_by_lua_block { require("resty.jev.edge").authz() }
    #     }
    #     location = /_jev/forward-auth {
    #         allow 10.0.0.0/24;
    #         deny all;
    #         content_by_lua_block { require("resty.jev.edge").forward_auth() }
    #     }
    # }
    #
    # A thin Worker (adapters/js, thinWorker) calls /_jev/authz from
    # Cloudflare's addresses, so that listener must take the internet: give
    # the Worker a secret (originToken, or the JEV_ORIGIN_TOKEN secret) and
    # refuse calls without it. Hex (`openssl rand -hex 32`): map compares
    # strings case-insensitively. 404, not 403: the Worker reads a 403 as a
    # block, and any other answer as an error it fails open on (its breaker
    # counts a 404). Terminate TLS in front: the token travels in a header.
    #
    # map $http_x_jev_origin_token $jev_origin_ok {   # here, at http level
    #     default 0;
    #     "<the Worker's secret>" 1;
    # }
    # server {
    #     listen 8081;
    #     large_client_header_buffers 4 64k;
    #     client_max_body_size 1m;
    #
    #     location /_jev/authz/ {
    #         if ($jev_origin_ok = 0) { return 404; }
    #         content_by_lua_block { require("resty.jev.edge").authz() }
    #     }
    # }

    # Admin endpoints on their own listener, bound to loopback. Keeping them
    # out of the traffic server means no gateway in front (Envoy, HAProxy,
    # a forward-auth proxy calling /_jev/authz on the listener above) can
    # reach them through path tricks, and the allow list is a second fence,
    # not the only one.
    server {
        listen 127.0.0.1:9180;
        set $jev_log "";
        access_log logs/access.log jev;

        location = /_jev/config {
            allow 127.0.0.1; deny all;
            content_by_lua_block { require("resty.jev.edge").config_api() }
        }

        location = /_jev/health {
            allow 127.0.0.1; deny all;
            content_by_lua_block { require("resty.jev.edge").health() }
        }

        location = /_jev/metrics {
            allow 127.0.0.1; deny all;
            content_by_lua_block { require("resty.jev.edge").metrics() }
        }

        # Sampled decisions (normalized text, fingerprint, score) when
        # sampling.enabled; GET lists, DELETE clears.
        location = /_jev/samples {
            allow 127.0.0.1; deny all;
            content_by_lua_block { require("resty.jev.edge").samples() }
        }

        # False-positive feedback: POST {"fp":...,"label":"benign","by":...}
        # with X-Jev-Token. The verdict it writes is a bypass for that exact
        # text, so keep it behind the token AND the allow list, and terminate
        # TLS in front of it.
        location = /_jev/feedback {
            allow 127.0.0.1; deny all;
            content_by_lua_block { require("resty.jev.edge").feedback() }
        }
    }
}
