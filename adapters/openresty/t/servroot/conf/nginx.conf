worker_processes  1;
daemon on;
master_process on;
error_log /work/adapters/openresty/t/servroot/logs/error.log debug;
pid       /work/adapters/openresty/t/servroot/logs/nginx.pid;
env MOCKEAGAIN_VERBOSE;
env MOCKEAGAIN;
env MOCKEAGAIN_WRITE_TIMEOUT_PATTERN;
env LD_PRELOAD;
env LD_LIBRARY_PATH;
env DYLD_INSERT_LIBRARIES;
env DYLD_FORCE_FLAT_NAMESPACE;
#env LUA_PATH;
#env LUA_CPATH;

worker_shutdown_timeout 300ms;

http {
    access_log /work/adapters/openresty/t/servroot/logs/access.log; client_body_temp_path /work/adapters/openresty/t/servroot/client_body_temp; proxy_temp_path /work/adapters/openresty/t/servroot/proxy_temp; fastcgi_temp_path /work/adapters/openresty/t/servroot/fastcgi_temp; scgi_temp_path /work/adapters/openresty/t/servroot/scgi_temp; uwsgi_temp_path /work/adapters/openresty/t/servroot/uwsgi_temp;
    #access_log off;

    default_type text/plain;
    keepalive_timeout  68000ms;


    lua_package_path "/work/adapters/openresty/lib/?.lua;/work/adapters/openresty/../../?.lua;;";
    lua_shared_dict jev_cache   8m;
    lua_shared_dict jev_config  1m;
    lua_shared_dict jev_metrics 1m;

    init_by_lua_block {
        require("resty.jev.edge").init("/work/adapters/openresty/t/servroot/html/jev-edge.conf.lua")
    }
    init_worker_by_lua_block { require("resty.jev.edge").init_worker() }

    server {
        listen          1984;
        #placeholder
        server_name     'localhost';
        
        client_max_body_size 30M;
        #client_body_buffer_size 4k;

        # Begin preamble config...

        # End preamble config...

        # Begin test case config...

location = /_jev/config { content_by_lua_block { require("resty.jev.edge").config_api() } }
location /v1/chat/completions {  access_by_lua_block { require("resty.jev.edge").access() }  
    content_by_lua_block {
        local h = ngx.req.get_headers()
        ngx.say("verdict=", h["x-jev-verdict"] or "-",
                " score=", h["x-jev-score"] or "-",
                " source=", h["x-jev-source"] or "-",
                " reason=", h["x-jev-reason"] or "-")
    }
 }

        # End test case config.

        location / {
            root /work/adapters/openresty/t/servroot/html;
            index index.html index.htm;
        }
    }
}



#timer_resolution 100ms;

events {
    accept_mutex off;

    worker_connections  64;
}
env ASAN_OPTIONS;
env MOCKNOEAGAIN_VERBOSE;
env MOCKNOEAGAIN;
user root;
