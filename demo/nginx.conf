# Demo nginx.conf: jev-edge on :8080 in front of a stub backend on :8081 that
# echoes the X-Jev-* headers it received. Verdict log lines go to stdout.
env TYPESAFE_API_KEY;
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nx/nginx.pid;
events {}
http {
    lua_package_path "/work/adapters/openresty/lib/?.lua;/work/?.lua;;";
    lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    lua_ssl_verify_depth 5;

    lua_shared_dict jev_cache   16m;
    lua_shared_dict jev_config   1m;
    lua_shared_dict jev_metrics  1m;
    lua_shared_dict jev_subject  4m;

    init_by_lua_block        { require("resty.jev.edge").init("/tmp/nx/conf/jev-edge.conf.lua") }
    init_worker_by_lua_block { require("resty.jev.edge").init_worker() }

    log_format jev escape=none '$jev_log';

    server {
        listen 8080;
        set $jev_log "";

        location /v1/ {
            access_log /dev/stdout jev;
            access_by_lua_block { require("resty.jev.edge").access() }
            log_by_lua_block    { require("resty.jev.edge").log() }
            proxy_pass http://127.0.0.1:8081;
        }
        location = /_jev/config  { content_by_lua_block { require("resty.jev.edge").config_api() } }
        location = /_jev/health  { content_by_lua_block { require("resty.jev.edge").health() } }
        location = /_jev/metrics { content_by_lua_block { require("resty.jev.edge").metrics() } }
        location = /_jev/samples { content_by_lua_block { require("resty.jev.edge").samples() } }
    }

    # Stub backend: shows what your application would receive.
    server {
        listen 127.0.0.1:8081;
        access_log off;
        location / {
            content_by_lua_block {
                local h = ngx.req.get_headers()
                for _, k in ipairs({ "X-Jev-Verdict", "X-Jev-Score", "X-Jev-Source", "X-Jev-Reason" }) do
                    ngx.header[k] = h[k:lower()]
                end
                ngx.header["Content-Type"] = "application/json"
                ngx.say('{"backend":"reached","verdict":"', h["x-jev-verdict"] or "-",
                        '","score":"', h["x-jev-score"] or "-", '","source":"', h["x-jev-source"] or "-", '"}')
            }
        }
    }
}
